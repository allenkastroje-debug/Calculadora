<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUD 2 · Banco de Reglajes</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
:root{--bg:#0b0d10;--surface:#14181d;--line:#262d36;--line2:#3a4452;--ink:#eef2f6;--muted:#8d98a5;--accent:#C6F432;--accent-ink:#10140a;--red:#FF3B30;--amber:#FFB020;
 --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);display:flex;flex-direction:column;min-height:100vh;overflow:hidden;transition:background .08s}
body.transp{background:transparent}
body.shift{--accent:var(--red);background:#2b0707}
body.shift.transp{background:rgba(120,10,10,.55)}
button,input{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
input[type=range]{accent-color:var(--accent);width:180px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar.off{display:none}
.grp{display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.dot.ok{background:#C6F432}
.st{color:var(--muted);font-size:13px}
a.st{color:var(--muted)}
.set{display:none;padding:10px 16px;border-bottom:1px solid var(--line);gap:10px 18px;flex-wrap:wrap;align-items:end;background:var(--bg)}
.set.on{display:flex}
.set label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:200px}
.set .row{display:flex;gap:10px;align-items:center}
#fit{flex:1;position:relative;overflow:hidden}
#hud{position:absolute;left:0;top:0;width:880px;height:560px;transform-origin:0 0;font-family:var(--display);font-variant-numeric:tabular-nums}
#hud{height:595px;width:1000px}
svg text{font-family:var(--display);fill:var(--ink)}
.mut{fill:var(--muted)!important}
.big{font-size:150px;font-weight:700}
#hud>*{position:absolute}
#gearBox{left:40px;top:70px;width:200px;text-align:left}
.lbl{margin:0;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:16px}
#gearV{font-size:170px;line-height:.9;font-weight:700;color:var(--accent)}
#spdBox{right:30px;top:70px;width:230px;text-align:right}
#spdV{font-size:150px;line-height:.9;font-weight:700}
#spdU{font-size:26px;color:var(--muted);letter-spacing:.1em}
#spdMax{font:13px var(--mono);color:var(--muted);cursor:pointer}
#strip{left:250px;top:524px;width:500px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--line)}
#strip div{padding-top:6px}#strip b{display:block;font-size:30px;font-weight:600}
#tyres{left:30px;top:300px;display:none}
#pedals{left:0;top:0}
.ped{position:absolute;bottom:0;width:10px;height:100%;background:#1b2128;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.ped i{position:absolute;left:0;right:0;bottom:0;height:0}
#gasW{left:262px;top:300px;height:180px;width:10px}#brkW{left:244px;top:300px;height:180px;width:10px}
#strW{left:300px;top:488px;width:400px;height:0}

</style>
</head>
<body>
<div class="bar" id="bar">
  <span class="dot" id="dot"></span><span class="st" id="st">Conectando…</span>
  <div class="grp" role="group" aria-label="Unidades"><button type="button" data-u="kmh">km/h</button><button type="button" data-u="mph">mph</button></div>
  <button type="button" id="bSet" aria-expanded="false">Ajustes</button>
  <a class="st" href="huds.html">Cambiar de HUD ↗</a>
  <button type="button" id="bHide" title="Atajo: tecla H">Ocultar barra</button>
</div>
<div class="set" id="set">
  <label>Dirección del receptor<input type="text" id="url" spellcheck="false"></label>
  <label>Aviso sin curva aprendida: <b id="shV">92</b> % de las rpm máximas
    <span class="row"><input type="range" id="sh" min="70" max="100" value="92"><button type="button" id="shTest">Probar aviso</button></span></label>
  <label>Adelantar (+) o retrasar (−) el inicio del aviso: <b id="ldV">100</b> ms
    <span class="row"><input type="range" id="ld" min="-300" max="600" step="10" value="100"><label style="display:flex;min-width:0;gap:4px;align-items:center"><input type="checkbox" id="auto"> Auto</label></span></label>
  <label>Mantener el aviso: <b id="hdV">1200</b> ms
    <span class="row"><input type="range" id="hd" min="0" max="3000" step="100" value="1200"></span></label>
  <label><span class="row"><input type="checkbox" id="transp"> Fondo transparente (OBS)</span></label>
  <details id="diag" style="flex-basis:100%"><summary class="st" style="cursor:pointer">Diagnóstico de datos</summary>
    <pre id="dg" style="margin:8px 0 0;font:12px/1.5 var(--mono);color:var(--muted)"></pre>
    <button type="button" id="rsC">Olvidar la curva de este coche</button></details>
</div>
<div id="fit"><div id="hud">
  <svg id="sv" width="1000" height="595" viewBox="0 0 1000 595" style="position:absolute;left:0;top:0">
    <g id="gTach"></g>
    <g id="gBoost"></g><g id="gPow"></g><g id="gTor"></g>
    <g id="needle"><line x1="-26" y1="0" x2="190" y2="0" stroke="var(--red)" stroke-width="5" stroke-linecap="round"/><circle r="14" fill="#1b2128" stroke="var(--line2)" stroke-width="3"/></g>
  </svg>
  <div id="gearBox"><p class="lbl">Marcha</p><div id="gearV">–</div></div>
  <div id="spdBox"><p class="lbl">Velocidad</p><div id="spdV">0</div><div id="spdU">KMH</div><div id="spdMax" title="Clic para reiniciar">máx <span id="mx">0</span></div></div>
  <div class="ped" id="brkW"><i id="brk" style="background:var(--red)"></i></div>
  <div class="ped" id="gasW"><i id="gas" style="background:var(--accent)"></i></div>
  <div id="strip"><div><p class="lbl">Vuelta <span id="lap">–</span></p><b id="cur">–</b></div><div><p class="lbl">Última</p><b id="last">–</b></div><div><p class="lbl">Mejor</p><b id="best">–</b></div></div>
</div>
<div id="nodata" style="display:none;position:absolute;inset:0;place-items:center;pointer-events:none"><div style="background:var(--surface);border:1px solid var(--line2);padding:10px 18px;border-radius:8px;color:var(--muted)">Sin datos del juego</div></div>
</div>
<style>#nodata.on{display:grid!important}</style>
<script src="js/hudcore.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),H=window.HUD,S=H.S,NS='http://www.w3.org/2000/svg';
function fit(){const f=$('fit'),w=f.clientWidth,h=f.clientHeight,k=Math.min(w/1000,h/595),hud=$('hud');hud.style.transform='scale('+k+')';hud.style.left=((w-1000*k)/2)+'px';hud.style.top=((h-595*k)/2)+'px'}
window.addEventListener('resize',fit);
function el(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
const rad=d=>d*Math.PI/180;
function pt(cx,cy,r,deg){return[cx+r*Math.cos(rad(deg)),cy+r*Math.sin(rad(deg))]}
function arc(cx,cy,r,a0,a1){const p0=pt(cx,cy,r,a0),p1=pt(cx,cy,r,a1);return'M'+p0[0].toFixed(1)+','+p0[1].toFixed(1)+'A'+r+','+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+p1[0].toFixed(1)+','+p1[1].toFixed(1)}
const A0=135,SP=270;
/* ---------- tacómetro ---------- */
const TC={x:500,y:280,r:215};let tachMax=0,fillArc,shMark,redArc;
function buildTach(mx){
  tachMax=mx;const g=$('gTach');g.innerHTML='';
  el(g,'circle',{cx:TC.x,cy:TC.y,r:TC.r+12,fill:'#0f1317',stroke:'var(--line2)','stroke-width':2});
  el(g,'path',{d:arc(TC.x,TC.y,TC.r-26,A0,A0+SP),fill:'none',stroke:'#1b2128','stroke-width':22,'stroke-linecap':'butt'});
  fillArc=el(g,'path',{d:'',fill:'none',stroke:'var(--accent)','stroke-width':22,'stroke-linecap':'butt'});
  const rl=A0+SP*0.9;redArc=el(g,'path',{d:arc(TC.x,TC.y,TC.r-6,rl,A0+SP),fill:'none',stroke:'var(--red)','stroke-width':6});
  const n=mx/500;
  for(let i=0;i<=n;i++){const major=i%2===0,a=A0+SP*i/n,p0=pt(TC.x,TC.y,TC.r-(major?2:2),a),p1=pt(TC.x,TC.y,TC.r-(major?26:16),a);
    el(g,'line',{x1:p0[0],y1:p0[1],x2:p1[0],y2:p1[1],stroke:i/n>=0.9?'var(--red)':'var(--ink)','stroke-width':major?3:1.5});
    if(major){const q=pt(TC.x,TC.y,TC.r-52,a);el(g,'text',{x:q[0],y:q[1]+9,'text-anchor':'middle','font-size':28,'font-weight':600,fill:'var(--ink)'},String(i/2))}}
  shMark=el(g,'path',{d:'',fill:'none',stroke:'var(--amber)','stroke-width':10});
  el(g,'text',{x:TC.x,y:TC.y+110,'text-anchor':'middle','font-size':16,class:'mut','letter-spacing':'2'},'RPM × 1000');
  rpmTxt=el(g,'text',{x:TC.x,y:TC.y+158,'text-anchor':'middle','font-size':46,'font-weight':600},'0');
}
let rpmTxt;
/* ---------- indicadores pequeños ---------- */
function Gauge(gid,cx,cy,r,label,unit,min,max,major,fmt){
  this.g=$(gid);this.cx=cx;this.cy=cy;this.r=r;this.min=min;this.max=max;this.major=major;this.build=function(){
    const g=this.g;g.innerHTML='';
    el(g,'circle',{cx:cx,cy:cy,r:r+8,fill:'#0f1317',stroke:'var(--line2)','stroke-width':2});
    el(g,'path',{d:arc(cx,cy,r-8,A0,A0+SP),fill:'none',stroke:'#1b2128','stroke-width':10});
    this.fill=el(g,'path',{d:'',fill:'none',stroke:'var(--accent)','stroke-width':10});
    const n=Math.max(1,Math.round((this.max-this.min)/this.major));
    for(let i=0;i<=n;i++){const a=A0+SP*i/n,p0=pt(cx,cy,r,a),p1=pt(cx,cy,r-8,a);el(g,'line',{x1:p0[0],y1:p0[1],x2:p1[0],y2:p1[1],stroke:'var(--muted)','stroke-width':1.5});
      const q=pt(cx,cy,r-24,a);el(g,'text',{x:q[0],y:q[1]+4,'text-anchor':'middle','font-size':11,class:'mut'},fmt(this.min+(this.max-this.min)*i/n))}
    el(g,'text',{x:cx,y:cy+r*0.84,'text-anchor':'middle','font-size':12,class:'mut','letter-spacing':'1.5'},label);
    this.val=el(g,'text',{x:cx,y:cy+8,'text-anchor':'middle','font-size':r>65?32:26,'font-weight':600},'–');
    el(g,'text',{x:cx,y:cy+r*0.36,'text-anchor':'middle','font-size':12,class:'mut'},unit)};
  this.set=function(v,txt){const f=Math.max(0,Math.min(1,(v-this.min)/(this.max-this.min)));this.fill.setAttribute('d',f>0.002?arc(cx,cy,r-8,A0,A0+SP*f):'');this.val.textContent=txt};
  this.build()}
const gb=new Gauge('gBoost',120,420,82,'BOOST','psi',-15,20,5,v=>Math.round(v));
let gp=new Gauge('gPow',775,420,62,'POTENCIA','hp',0,300,100,v=>Math.round(v));
let gt=new Gauge('gTor',905,420,62,'PAR','N·m',0,400,100,v=>Math.round(v));
let pMax=300,tMax=400;
function rescale(){
  const nP=Math.max(100,Math.ceil((H.peak.pow/745.7*1.1)/100)*100),nT=Math.max(100,Math.ceil((H.peak.tor*1.1)/100)*100);
  if(nP!==pMax){pMax=nP;gp.max=nP;gp.major=100;gp.build()}
  if(nT!==tMax){tMax=nT;gt.max=nT;gt.build()}
  const nB=Math.max(20,Math.ceil(H.peak.boost/5)*5);if(nB!==gb.max){gb.max=nB;gb.build()}
}
const fmtT=t=>{if(!(t>0))return '–';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(3)};
let lastScale=0;
H.onFrame(function(m){
  if(!m.on)return;
  const mx=Math.ceil((m.rpmMax>0?m.rpmMax:8000)/1000)*1000;if(mx!==tachMax)buildTach(mx);
  const f=Math.max(0,Math.min(1,m.rpm/mx)),ang=A0+SP*f;
  $('needle').setAttribute('transform','translate('+TC.x+','+TC.y+') rotate('+ang.toFixed(2)+')');
  fillArc.setAttribute('d',f>0.002?arc(TC.x,TC.y,TC.r-26,A0,ang):'');
  if(H.rpmShift){const a=A0+SP*Math.min(1,H.rpmShift/mx);shMark.setAttribute('d',arc(TC.x,TC.y,TC.r-6,a-0.8,a+0.8))}
  rpmTxt.textContent=Math.round(m.rpm);
  const k=S.u==='mph'?2.23694:3.6;
  $('spdV').textContent=Math.round(m.spd*k);$('spdU').textContent=S.u==='mph'?'MPH':'KMH';$('mx').textContent=Math.round(H.maxSpd);
  $('gearV').textContent=m.gear===0?'R':(m.gear||'–');
  $('gas').style.height=(m.gas/255*100)+'%';$('brk').style.height=(m.brk/255*100)+'%';
  const now=performance.now();if(now-lastScale>1000){lastScale=now;rescale()}
  gb.set(m.boost,(m.boost>0?'+':'')+m.boost.toFixed(1));
  gp.set(m.pow/745.7,m.pow>0?String(Math.round(m.pow/745.7)):'–');
  gt.set(m.tor,m.tor>0?String(Math.round(m.tor)):'–');
  $('lap').textContent=m.lap!=null?m.lap:'–';$('cur').textContent=fmtT(m.cur);$('last').textContent=fmtT(m.last);$('best').textContent=fmtT(m.best);
  if($('diag').open)diag(m);
});
function diag(m){const r=H.ratios();$('dg').textContent=
  'rpm '+Math.round(m.rpm)+' / máx '+Math.round(m.rpmMax)+'   marcha '+m.gear+'   vel '+m.spd.toFixed(1)+' m/s\n'+
  'acel '+m.gas+'  freno '+m.brk+'  potencia '+Math.round(m.pow/745.7)+' hp  par '+Math.round(m.tor)+' N·m  boost '+m.boost+'\n'+
  'aviso: '+(H.mode==='curva'?'por curva de potencia':'por porcentaje fijo')+' · cambio a '+Math.round(H.rpmShift||0)+' rpm · puntos de curva '+H.curve().length+'\n'+
  'relaciones: '+(Object.keys(r).map(g=>g+'ª '+r[g]).join(' · ')||'aprendiendo…')}
$('diag').addEventListener('toggle',()=>{if(H.last)diag(H.last)});
$('rsC').addEventListener('click',()=>{if(confirm('¿Olvidar la curva aprendida de este coche?'))H.resetCurve()});
function applyUI(){
  document.querySelectorAll('[data-u]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.u===S.u)));
  $('url').value=S.url;$('transp').checked=S.transp;document.body.classList.toggle('transp',S.transp);
  $('sh').value=S.sh;$('shV').textContent=S.sh;$('ld').value=S.lead;$('ldV').textContent=S.lead;$('auto').checked=!!S.auto;$('hd').value=S.hold;$('hdV').textContent=S.hold;H.saveS();fit()}
document.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click',()=>{S.u=b.dataset.u;H.maxSpd=0;applyUI()}));
$('bSet').addEventListener('click',()=>{const o=$('set').classList.toggle('on');$('bSet').setAttribute('aria-expanded',String(o));fit()});
$('bHide').addEventListener('click',()=>{$('bar').classList.add('off');$('set').classList.remove('on');fit()});
document.addEventListener('keydown',e=>{if((e.key==='h'||e.key==='H')&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){$('bar').classList.toggle('off');$('set').classList.remove('on');fit()}});
$('url').addEventListener('change',()=>{S.url=$('url').value.trim();H.saveS();H.connect()});
$('transp').addEventListener('change',()=>{S.transp=$('transp').checked;applyUI()});
$('sh').addEventListener('input',()=>{S.sh=+$('sh').value;$('shV').textContent=S.sh;H.saveS()});
$('ld').addEventListener('input',()=>{S.lead=+$('ld').value;$('ldV').textContent=S.lead;H.saveS()});
$('hd').addEventListener('input',()=>{S.hold=+$('hd').value;$('hdV').textContent=S.hold;H.saveS()});
$('auto').addEventListener('change',()=>{S.auto=$('auto').checked;H.saveS()});
H.leadSet=v=>{$('ld').value=v;$('ldV').textContent=v};
$('shTest').addEventListener('click',()=>H.testShift());
$('spdMax').addEventListener('click',()=>{H.maxSpd=0;$('mx').textContent='0'});
H.onStatus((t,ok)=>{$('st').textContent=t;$('dot').className='dot'+(ok?' ok':'')});
setInterval(()=>$('nodata').classList.toggle('on',H.stale()),400);
if(location.hash==='#kiosk')$('bar').classList.add('off');
buildTach(8000);applyUI();H.connect();
})();
</script>
</body>
</html>
